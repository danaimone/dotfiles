unbind r
bind r source-file ~/.tmux.conf

set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-ghostty:clipboard:RGB,xterm-256color:clipboard:RGB"

set -g prefix C-s

set -g mouse on

# Unstick mouse reporting. If a TUI (e.g. Claude Code over SSH) dies without
# disabling mouse tracking, tmux keeps forwarding every hover to the pane and
# the shell prints junk like "35;37;44M". Writing the disable sequences to the
# pane's tty makes tmux read them as pane output and drop the mode, so this
# works even when the stuck shell is on a remote host.
bind X run-shell "printf '\\033[?1000l\\033[?1002l\\033[?1003l\\033[?1006l\\033[?1015l' > #{pane_tty}" \; display-message "mouse reporting reset"
set -g allow-passthrough on
set -sg escape-time 50

# Extended key support (needed by modern TUIs like Claude Code / Pi)
set -g extended-keys on
set -g extended-keys-format csi-u

# Clipboard integration: let programs set the macOS system clipboard via OSC 52
set -g set-clipboard on

# Copy-mode (vi) selection behaves like vim and yanks to the clipboard.
# Portable copy: use pbcopy locally (macOS); otherwise rely on set-clipboard
# (OSC 52) to carry the selection to the outer terminal over SSH.
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "command -v pbcopy >/dev/null 2>&1 && pbcopy || cat >/dev/null"
bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "command -v pbcopy >/dev/null 2>&1 && pbcopy || cat >/dev/null"

# Auto-name windows from what's running in them:
#   - idle shell        -> current directory name
#   - anything else     -> the pane title, if a program set one. Claude Code
#     sets it to "<status glyph> <topic>" via OSC 2, and that escape survives
#     SSH, so a Claude running on the homelab names the local window too.
#   - otherwise         -> the command name
# A manual rename (prefix ,) pins that window's name.
set -g automatic-rename on
set -g allow-rename off
set -g automatic-rename-format "#{?#{m/r:^-?(zsh|bash|fish|sh)$,#{pane_current_command}},#{b:pane_current_path},#{?#{&&:#{pane_title},#{&&:#{!=:#{pane_title},#{host}},#{!=:#{pane_title},#{host_short}}}},#{=/32/…:pane_title},#{pane_current_command}}}"

# Pass the window name up to the terminal tab. When tmux is nested (tmux on
# the homelab inside tmux on the Mac), this also carries the inner window's
# Claude topic up to the outer tmux.
set -g set-titles on
set -g set-titles-string "#W"

# New windows/panes open in the current pane's directory
bind c new-window -c "#{pane_current_path}"
bind '"' split-window -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

set-window-option -g mode-keys vi

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position top

# Catppuccin theme configuration (must be BEFORE loading plugins)
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "custom"

set -g @catppuccin_window_left_separator "#[bg=default,fg=#{@thm_overlay_2}]#[bg=#{@thm_overlay_2},fg=#{@thm_surface_0}]"
set -g @catppuccin_window_right_separator "#[bg=default,fg=#{@thm_surface_0}]"
set -g @catppuccin_window_current_left_separator "#[bg=default,fg=#{@thm_mauve}]#[bg=#{@thm_mauve},fg=#{@thm_bg}]"
set -g @catppuccin_window_current_middle_separator "#[fg=#{@thm_mauve}]█"
set -g @catppuccin_window_current_right_separator "#[bg=default,fg=#{@thm_surface_1}]"

set -g @catppuccin_status_background "none"
set -g @catppuccin_window_text " #W"
set -g @catppuccin_window_number "#I "
set -g @catppuccin_window_current_text " #W"
set -g @catppuccin_window_current_number "#I"

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'

# Renumber windows automatically
set -g renumber-windows on

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# Load catppuccin theme (manual installation)
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
